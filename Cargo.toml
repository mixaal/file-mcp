[package]
name = "file-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "file-mcp"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
